# 智能客服统一入口：静态前端 + API/WS 反代
server {
    listen 80;
    server_name _;

    # 知识库文件上传：放行到 110MB（业务层 kb_max_file_mb 上限 100MB + multipart 开销），
    # 精确限制由 agent 业务层按平台配置动态校验
    client_max_body_size 110m;

    # 使用 Docker 内置 DNS 服务器，避免 upstream IP 缓存
    # 当容器重启导致 IP 变化时，Nginx 能自动重新解析
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # 管理后台（Vue3 单页应用，构建产物在 web/admin/dist）
    location /admin/ {
        alias /usr/share/nginx/html/web/admin/dist/;
        index index.html;
        # hash 路由无需 rewrite；兜底到 index.html 防刷新 404
        try_files $uri $uri/ /admin/index.html;
        # 前端 JS/HTML 更新频繁：no-cache 确保浏览器每次 revalidate，避免旧 JS 混合引用
        add_header Cache-Control "no-cache";
    }

    # 聊天内核（PC + H5）
    location /chat/ {
        alias /usr/share/nginx/html/web/chat/;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # SDK 接入脚本 + 多端接入示例（第三方网站引入）
    location /sdk/ {
        alias /usr/share/nginx/html/web/sdk/;
        index index.html;
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=3600";
    }
    # 知识库原文件（共享卷挂载，上传时由 agent 落盘，此处直接静态服务）
    # 安全性：路径含随机 doc_id + 租户前缀，外部无法枚举；如需更强鉴权可换签名 URL/对象存储
    # charset utf-8：让 txt/md 预览按 UTF-8 渲染（避免中文乱码），pdf 等二进制不受影响
    location /kb_files/ {
        alias /usr/share/nginx/html/kb_files/;
        add_header Cache-Control "public, max-age=86400";
        charset utf-8;
    }

    # P1-5：SDK 版本化 URL（/sdk/cs-chat@x.y.z.js 始终指向当前版本文件）
    # 升级 SDK 时第三方无需改 URL，只需更新版本号参数即可强制刷新浏览器缓存
    location ~ ^/sdk/cs-chat@[0-9]+\.[0-9]+\.[0-9]+\.js$ {
        alias /usr/share/nginx/html/web/sdk/cs-chat.js;
        add_header Cache-Control "public, max-age=86400";
    }

    # 根路径重定向到 SDK 多端接入示例页
    location = / {
        return 301 /sdk/;
    }

    # API 与 WebSocket 反代到 Go 网关
    # 使用变量方式，强制每次请求重新解析 DNS，避免容器重启后 IP 变化导致 502
    location / {
        set $go_backend "http://go:8080";
        proxy_pass $go_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 5s;
    }
}
